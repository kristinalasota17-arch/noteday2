<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8175D8">
<title>Daynote</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F7F6FC;--ac:#8175D8;--ac2:#ebe8fb;--tx:#1c1b29;--mu:#8b89a0;--cd:#fff;--ln:#ececf6;--sh:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13121b;--cd:#1e1d2b;--tx:#f2f1fa;--mu:#9a98b0;--ln:#2c2b3d;--ac2:#2c2848;--sh:none}}
:root[data-theme="dark"]{--bg:#13121b;--cd:#1e1d2b;--tx:#f2f1fa;--mu:#9a98b0;--ln:#2c2b3d;--ac2:#2c2848;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,system-ui,sans-serif;font-size:16px}
button,input,textarea{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
#main{flex:1;overflow-y:auto;padding:14px 18px 24px}
.hd{display:flex;gap:12px;align-items:center;margin:6px 0 16px}
h1{margin:0;font-size:32px;letter-spacing:-.02em;font-weight:700}
.hd p{margin:2px 0 0;color:var(--mu);font-size:15px}.hd p::first-letter{text-transform:uppercase}
h3{font-size:15px;margin:18px 4px 8px;color:var(--mu);font-weight:600}
.bk{flex:none;border:0;background:var(--cd);box-shadow:var(--sh);width:40px;height:40px;border-radius:14px;font-size:24px;color:var(--ac);padding:0}
.card{background:var(--cd);border-radius:20px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px}
.big{width:100%;border:0;border-radius:18px;background:var(--ac);color:#fff;font-size:17px;font-weight:600;padding:16px;margin:0 0 14px;box-shadow:0 8px 20px rgba(129,117,216,.35);transition:transform .15s}
.big:active,.tile:active,.rb:active{transform:scale(.96)}
.seg{display:flex;background:var(--ln);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-weight:600;color:var(--mu)}
.seg .on{background:var(--cd);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tk{display:flex;gap:12px;align-items:flex-start}.g{flex:1;min-width:0;cursor:pointer}
.tt{font-weight:600;font-size:17px}.dn .tt{text-decoration:line-through;color:var(--mu)}.dn{opacity:.7}
.ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ac);background:none;color:#fff;font-size:15px;padding:0;margin-top:1px}.ck.on{background:var(--ac)}
.mt{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px;color:var(--mu)}
.mt span{background:var(--bg);border-radius:9px;padding:3px 8px;display:flex;align-items:center;gap:5px}
.mt u{width:7px;height:7px;border-radius:50%}.od{color:#e0605f!important}
.mu{color:var(--mu);font-size:14px}.c{text-align:center}.em{text-align:center;color:var(--mu);padding:40px 20px}
.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
#nav{display:flex;flex:none;background:var(--cd);box-shadow:0 -4px 24px rgba(129,117,216,.14);padding:9px 10px 8px;border-radius:26px 26px 0 0}
.ni{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mu);padding:0}
.ni i{font-style:normal;font-size:26px;width:62px;height:36px;display:grid;place-items:center;border-radius:18px;transition:.2s}
.ni b{font-size:12px;font-weight:600}.ni.on{color:var(--ac)}.ni.on i{background:var(--ac2)}
#ov{position:fixed;inset:0;background:rgba(20,18,40,.4);opacity:0;pointer-events:none;transition:.25s;z-index:20}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:92%;background:var(--cd);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column}
#sh.on{transform:none}#ov.on{opacity:1;pointer-events:auto}
#sc{overflow-y:auto;padding:8px 18px calc(28px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:8px auto 0;flex:none}
.sh{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px}.sh b{font-size:18px}
.lk{border:0;background:none;color:var(--ac);font-weight:600;font-size:16px;padding:6px 0}
.dl{width:100%;border:0;background:none;color:#e0605f;font-weight:600;padding:14px}
.in{width:100%;border:0;background:var(--bg);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-size:16px;resize:none;outline:none;cursor:text}
.in:focus{box-shadow:0 0 0 2px var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 8px;font-weight:500}
.ch{display:flex;flex-wrap:wrap;gap:8px}
.ch button,.dc{border:0;background:var(--bg);border-radius:12px;padding:9px 13px;color:var(--tx)}
.ch .on,.dc.on{background:var(--ac);color:#fff}
.dcs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.dc{flex:none;width:54px;display:flex;flex-direction:column;align-items:center;padding:8px 0}.dc small{font-size:11px;opacity:.8}.dc b{font-size:18px}
.ww{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;height:160px;background:var(--bg);border-radius:16px;overflow:hidden;margin-bottom:6px}
.ww::after{content:"";position:absolute;left:12px;right:12px;top:60px;height:40px;background:var(--ac2);border-radius:12px;pointer-events:none}
.wh{position:relative;z-index:1;width:80px;height:160px;overflow-y:auto;scroll-snap-type:y mandatory;padding:60px 0;scrollbar-width:none}
.wh::-webkit-scrollbar{display:none}
.wh div{height:40px;line-height:40px;text-align:center;font-size:22px;font-weight:600;scroll-snap-align:center}
.rg{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--ln) 0)}
.rg span{width:44px;height:44px;border-radius:50%;background:var(--cd);display:grid;place-items:center;font-size:22px}
.rb{flex:none;width:44px;height:44px;border-radius:14px;border:0;background:var(--ac2);color:var(--ac);font-size:24px;font-weight:600;padding:0;transition:transform .15s}.rb.p{background:var(--ac);color:#fff}
.bars{display:flex;gap:5px;height:34px;margin-top:12px}
.bars i{flex:1;background:var(--ln);border-radius:5px;position:relative;overflow:hidden}.bars b{position:absolute;bottom:0;left:0;right:0;background:var(--ac)}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:5px;transition:width .4s}.bar.ov i{background:#ef7f7f}
.kk{font-size:15px;color:var(--mu)}.kk b{font-size:30px;color:var(--tx)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln)}.rw:last-child{border:0}
.rt{display:flex;gap:8px;align-items:center}.rt .rb{width:34px;height:34px;font-size:17px}
.dn2{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dn2 button{border:0;background:var(--cd);box-shadow:var(--sh);width:40px;height:40px;border-radius:14px;font-size:22px;color:var(--ac);padding:0}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{border:0;text-align:left;background:var(--cd);box-shadow:var(--sh);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;font-weight:600;font-size:17px;transition:transform .15s}
.tile i{font-style:normal;font-size:36px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--ln);border:0;position:relative;flex:none;transition:.2s;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--ac)}.sw.on::after{left:22px}
.cv{display:grid;place-items:center;padding:12px}canvas{width:100%;max-width:300px;aspect-ratio:1;border-radius:16px;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin:12px 0 16px}
.pad button{height:54px;border:0;border-radius:16px;background:var(--cd);box-shadow:var(--sh);font-size:22px;color:var(--ac);padding:0}
.pet{font-size:110px;text-align:center;line-height:1.2;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){.pet{animation:none}}
.sb{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}.sb span{width:84px}.sb .bar{flex:1;margin:0}
#ts{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px);background:#1c1b29;color:#fff;padding:11px 18px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;font-size:14px;max-width:86%;text-align:center}
#ts.on{opacity:1;transform:translate(-50%,0)}
h1{font-size:28px;font-weight:600}
.card,.tile,.bk,.dn2 button,.pad button{border:1px solid var(--ln)}
.card,.tile{border-radius:16px}
.big{border-radius:14px;padding:14px;font-size:16px;box-shadow:none}
#nav{border-radius:0;box-shadow:none;border-top:1px solid var(--ln);padding:8px 8px 6px}
.ni i{width:auto;height:28px;background:none!important;border-radius:0}
.ni svg{width:26px;height:26px}.ni b{font-weight:500;font-size:11px}
.tile{gap:14px;font-size:16px;font-weight:500}.tile i{display:block;color:var(--ac)}.tile i svg{width:28px;height:28px}.tile .mu{font-weight:400}
.seg{border-radius:12px}.seg button{font-size:15px}
</style></head>
<body><div id="app"><div id="main"></div><div id="nav"></div></div>
<div id="ov" data-a="closeSheet"></div><div id="sh"><div class="grab"></div><div id="sc"></div></div><div id="ts"></div>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ds(d)};
const fmt=(s,o)=>new Date(s+'T12:00').toLocaleDateString('ru-RU',o||{day:'numeric',month:'short'});
const rel=d=>d===today()?'Сегодня':d===addD(today(),1)?'Завтра':d===addD(today(),-1)?'Вчера':fmt(d);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DEF=()=>({tasks:[],diary:[],trk:[],food:[],prod:{},nav:['tasks','diary','trk'],goal:2000,best:0,theme:'auto',pet:{h:80,j:80,e:80,t:Date.now()}});
let D;try{D=Object.assign(DEF(),JSON.parse(localStorage.getItem('daynote')||'{}'))}catch(e){D=DEF()}
const save=()=>{try{localStorage.setItem('daynote',JSON.stringify(D))}catch(e){}};
const ic=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const PLUS=ic('<path d="M12 5v14M5 12h14"/>');
const SEC={tasks:[ic('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/>'),'Задачи'],diary:[ic('<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/>'),'Дневник'],trk:[ic('<path d="M5 20V11M12 20V5M19 20v-6"/>'),'Трекеры'],cal:[ic('<path d="M12 3c2 3 6 5 6 10a6 6 0 01-12 0c0-2 1-3 2-4 .5 1.5 1.5 2 2 2 0-3-.5-5 2-8z"/>'),'Калории'],games:[ic('<rect x="3" y="8" width="18" height="10" rx="5"/><path d="M8 11v4M6 13h4"/><circle cx="16" cy="12" r=".8"/><circle cx="18" cy="14" r=".8"/>'),'Игры'],set:[ic('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'),'Настройки']};
const PR=['Низкий','Средний','Высокий'],PC=['#9bd3a5','#f2c46d','#ef7f7f'],CAT=['Личное','Работа','Учёба','Дом','Здоровье'];
const MOOD=['Хорошо','Спокойно','Обычно','Грустно','Злюсь'],MEALS=['Завтрак','Обед','Ужин','Перекус'],NUMK=['pr','rem','rep'];
let page='tasks',tab='act',calDate=today(),F={},SB=null,SN=null,petT=0;
const act={};
const toast=t=>{const e=$('#ts');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)};
const empty=t=>`<div class="em">${t}</div>`;
const bk=()=>D.nav.includes(page)?'':'more';
const head=(t,s,b)=>`<div class="hd">${b?`<button class="bk" data-a="go" data-v="${b}">‹</button>`:''}<div><h1>${t}</h1><p>${s||''}</p></div></div>`;
const seg=(o,v,a)=>`<div class="seg">${o.map(([k,l])=>`<button class="${k===v?'on':''}" data-a="${a}" data-v="${k}">${l}</button>`).join('')}</div>`;
const chip=(k,l,sel)=>`<div class="ch">${l.map(([v,t])=>`<button class="${String(sel)===String(v)?'on':''}" data-a="setF" data-k="${k}" data-v="${esc(v)}">${t}</button>`).join('')}</div>`;
function dchips(sel,key,from,to,none){let h='';for(let i=from;i<=to;i++){const d=addD(today(),i);h+=`<button class="dc ${sel===d?'on':''}" data-a="setF" data-k="${key}" data-v="${d}"><small>${i==0?'Сег':fmt(d,{weekday:'short'})}</small><b>${+d.slice(8)}</b></button>`}
 if(none)h=`<button class="dc ${sel===''?'on':''}" data-a="setF" data-k="${key}" data-v=""><small>Нет</small><b>–</b></button>`+h;return `<div class="dcs">${h}</div>`}
function shf(title,body,sv,del){return `<div class="sh"><button class="lk" data-a="closeSheet">Отмена</button><b>${title}</b><span style="width:52px"></span></div>${body}<button class="big" style="margin-top:18px" data-a="${sv}">Сохранить</button>${del?`<button class="dl" data-a="del" data-v="${del}">Удалить</button>`:''}`}
function openSheet(fn){SB=fn;$('#sc').innerHTML=fn();$('#sc').scrollTop=0;$('#ov').classList.add('on');$('#sh').classList.add('on');initWheels()}
function refresh(){const s=$('#sc'),y=s.scrollTop,d=$('.dcs'),x=d?d.scrollLeft:0;s.innerHTML=SB();s.scrollTop=y;const d2=$('.dcs');if(d2)d2.scrollLeft=x;initWheels()}
act.closeSheet=()=>{$('#ov').classList.remove('on');$('#sh').classList.remove('on')};
act.setF=(v,el)=>{const k=el.dataset.k;F[k]=NUMK.includes(k)?+v:v;refresh()};
act.del=(v,el)=>{if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Нажмите ещё раз для удаления';return}const[a,id]=v.split(':');D[a]=D[a].filter(x=>x.id!==id);save();act.closeSheet();render()};
function upsert(a,o){const i=D[a].findIndex(x=>x.id===o.id);if(i<0)D[a].push(o);else D[a][i]=o;save();act.closeSheet();render()}
function render(){const v={tasks:vTasks,diary:vDiary,trk:vTrk,cal:vCal,games:vGames,set:vSet,more:vMore,snake:vSnake,pet:vPet}[page]();
 $('#main').innerHTML=v;
 $('#nav').innerHTML=D.nav.map(k=>`<button class="ni ${page===k?'on':''}" data-a="go" data-v="${k}"><i>${SEC[k][0]}</i><b>${SEC[k][1]}</b></button>`).join('')+`<button class="ni ${D.nav.includes(page)?'':'on'}" data-a="go" data-v="more"><i>${PLUS}</i><b>Ещё</b></button>`}
act.go=p=>{stopGames();page=p;render();$('#main').scrollTop=0};
act.tab=v=>{tab=v;render()};
/* wheels */
function initWheels(){$$('.wh').forEach(w=>{const[h,m]=(F.time||'09:00').split(':').map(Number);w.scrollTop=(w.id==='wh'?h:Math.round(m/5))*40;
 w.onscroll=()=>{clearTimeout(w._t);w._t=setTimeout(()=>{F.time=pad(Math.min(23,Math.round($('#wh').scrollTop/40)))+':'+pad(Math.min(55,Math.round($('#wm').scrollTop/40)*5))},90)}})}
const wheel=(id,n,st)=>{let o='';for(let i=0;i<n;i+=st)o+=`<div>${pad(i)}</div>`;return `<div class="wh" id="${id}">${o}</div>`};
/* tasks */
const nextDate=(s,r)=>{if(r===1)return addD(s,1);if(r===2)return addD(s,7);const d=new Date(s+'T12:00');d.setMonth(d.getMonth()+1);return ds(d)};
function vTasks(){const a=tab==='act',L=D.tasks.filter(t=>!t.done===a).sort((x,y)=>(x.date||'9')+(x.time||'99')<(y.date||'9')+(y.time||'99')?-1:1);
 return head('Мой день',fmt(today(),{weekday:'long',day:'numeric',month:'long'}))+`<button class="big" data-a="tEdit">Добавить задачу</button>`+seg([['act','Активные'],['done','Выполненные']],tab,'tab')+
 (L.length?L.map(t=>`<div class="card tk ${t.done?'dn':''}"><button class="ck ${t.done?'on':''}" data-a="tDone" data-v="${t.id}">${t.done?'✓':''}</button><div class="g" data-a="tEdit" data-v="${t.id}"><div class="tt">${esc(t.title)}</div>${t.desc?`<div class="mu">${esc(t.desc)}</div>`:''}<div class="mt">${t.date?`<span class="${!t.done&&t.date<today()?'od':''}">${esc(rel(t.date))}${t.time?' '+t.time:''}</span>`:''}<span>${esc(t.cat)}</span><span><u style="background:${PC[t.pr]}"></u>${PR[t.pr]}</span>${t.rep?'<span>Повтор</span>':''}${t.rem?'<span>Напоминание</span>':''}</div></div></div>`).join(''):empty(a?'Задач пока нет. Нажмите «Добавить задачу».':'Выполненных задач пока нет.'))}
act.tEdit=id=>{F=id?{...D.tasks.find(t=>t.id===id)}:{id:'',title:'',desc:'',date:today(),time:'09:00',cat:'Личное',pr:1,rem:1,rep:0};openSheet(tForm)};
function tForm(){return shf(F.id?'Задача':'Новая задача',`<input class="in" data-f="title" placeholder="Название" value="${esc(F.title)}"><textarea class="in" data-f="desc" rows="2" placeholder="Описание">${esc(F.desc)}</textarea>
<label>Дата</label>${dchips(F.date,'date',0,13,1)}<label>Время</label>${F.time?`<div class="ww">${wheel('wh',24,1)}<b>:</b>${wheel('wm',60,5)}</div>`:''}<button class="lk" data-a="noTime">${F.time?'Без времени':'Указать время'}</button>
<label>Категория</label>${chip('cat',CAT.map(c=>[c,c]),F.cat)}<label>Приоритет</label>${chip('pr',PR.map((p,i)=>[i,p]),F.pr)}
<label>Напоминание</label>${chip('rem',[[0,'Нет'],[1,'В срок'],[2,'За 10 минут'],[3,'За час']],F.rem)}<label>Повтор</label>${chip('rep',[[0,'Нет'],[1,'Каждый день'],[2,'Каждую неделю'],[3,'Каждый месяц']],F.rep)}`,'tSave',F.id&&'tasks:'+F.id)}
act.noTime=()=>{F.time=F.time?'':'09:00';refresh()};
act.tSave=()=>{if(!F.title.trim())return toast('Введите название');const t={...F,title:F.title.trim(),n:false};if(!t.id)t.id=uid();upsert('tasks',t)};
act.tDone=id=>{const t=D.tasks.find(x=>x.id===id);t.done=!t.done;if(t.done&&t.rep&&!t.sp){t.sp=1;D.tasks.push({...t,id:uid(),done:false,sp:0,n:false,date:nextDate(t.date||today(),t.rep)})}save();render()};
/* reminders */
function tick(){const now=Date.now();let ch=0;D.tasks.forEach(t=>{if(t.done||!t.rem||!t.date||t.n)return;const dt=new Date(t.date+'T'+(t.time||'09:00')).getTime(),f=dt-[0,0,10,60][t.rem]*6e4;
 if(now>=f&&now<dt+36e5){t.n=true;ch=1;if('Notification' in window&&Notification.permission==='granted')try{new Notification('Daynote',{body:t.title})}catch(e){}toast('Напоминание: '+t.title)}});if(ch)save()}
/* diary */
function vDiary(){const L=[...D.diary].sort((a,b)=>a.date===b.date?(a.id<b.id?1:-1):(a.date<b.date?1:-1));
 return head('Дневник','Ваши мысли и события')+`<button class="big" data-a="dEdit">Новая запись</button>`+(L.length?L.map(e=>`<div class="card g" data-a="dEdit" data-v="${e.id}"><div class="mt" style="margin:0 0 8px"><span>${fmt(e.date,{weekday:'short',day:'numeric',month:'long'})}</span><span>${e.mood}</span></div><div class="clip">${esc(e.text)}</div></div>`).join(''):empty('Здесь появятся ваши записи.'))}
act.dEdit=id=>{F=id?{...D.diary.find(e=>e.id===id)}:{id:'',date:today(),mood:'Хорошо',text:''};openSheet(()=>shf('Запись',`<label>Дата</label>${dchips(F.date,'date',-13,0)}<label>Настроение</label>${chip('mood',MOOD.map(m=>[m,m]),F.mood)}<label>Текст</label><textarea class="in" data-f="text" rows="9" placeholder="Что сегодня произошло?">${esc(F.text)}</textarea>`,'dSave',F.id&&'diary:'+F.id))};
act.dSave=()=>{if(!F.text.trim())return toast('Напишите текст записи');if(!F.id)F.id=uid();upsert('diary',{...F})};
/* trackers */
function streak(t){let d=today(),s=0;if((t.log[d]||0)<t.goal)d=addD(d,-1);while((t.log[d]||0)>=t.goal){s++;d=addD(d,-1)}return s}
function vTrk(){return head('Трекеры','Привычки и показатели')+`<button class="big" data-a="kEdit">Новый трекер</button>`+(D.trk.length?D.trk.map(t=>{const v=t.log[today()]||0,tot=Object.values(t.log).reduce((a,b)=>a+b,0);let b='';for(let i=6;i>=0;i--)b+=`<i><b style="height:${Math.min(100,(t.log[addD(today(),-i)]||0)/t.goal*100)}%"></b></i>`;
 return `<div class="card"><div class="tk" style="align-items:center"><div class="rg" style="--p:${Math.min(100,v/t.goal*100)}"><span style="font-size:13px;font-weight:600">${Math.round(Math.min(100,v/t.goal*100))}%</span></div><div class="g" data-a="kEdit" data-v="${t.id}"><div class="tt">${esc(t.name)}</div><div class="mu">Сегодня ${v} из ${t.goal}, серия ${streak(t)} дн., всего ${tot}</div></div><button class="rb" data-a="tc" data-v="${t.id}:-1">−</button><button class="rb p" data-a="tc" data-v="${t.id}:1">+</button></div><div class="bars">${b}</div></div>`}).join(''):empty('Создайте первый трекер: вода, чтение, тренировка.'))}
act.tc=v=>{const[id,d]=v.split(':'),t=D.trk.find(x=>x.id===id),k=today();t.log[k]=Math.max(0,(t.log[k]||0)+ +d);save();render()};
act.kEdit=id=>{F=id?{...D.trk.find(t=>t.id===id)}:{id:'',name:'',goal:1,log:{}};openSheet(()=>shf('Трекер',`<input class="in" data-f="name" placeholder="Название" value="${esc(F.name)}"><label>Цель на день</label><input class="in" type="number" inputmode="numeric" min="1" data-f="goal" value="${esc(F.goal)}">`,'kSave',F.id&&'trk:'+F.id))};
act.kSave=()=>{if(!F.name.trim())return toast('Введите название');if(!F.id)F.id=uid();upsert('trk',{...F,name:F.name.trim(),goal:Math.max(1,Math.round(+F.goal)||1)})};
/* calories */
function vCal(){const E=D.food.filter(f=>f.date===calDate),tot=E.reduce((a,f)=>a+f.kcal,0);
 return head('Калории','Пищевой дневник',bk())+`<div class="dn2"><button data-a="cd" data-v="-1">‹</button><b>${rel(calDate)}</b><button data-a="cd" data-v="1">›</button></div><div class="card"><div class="kk"><b>${tot}</b> из ${D.goal} ккал</div><div class="bar ${tot>D.goal?'ov':''}"><i style="width:${Math.min(100,tot/D.goal*100)}%"></i></div></div><button class="big" data-a="fEdit">Добавить продукт</button>`+
 (E.length?MEALS.map(m=>{const l=E.filter(f=>f.meal===m);return l.length?`<h3>${m}, ${l.reduce((a,f)=>a+f.kcal,0)} ккал</h3><div class="card">${l.map(f=>`<div class="rw g" data-a="fEdit" data-v="${f.id}"><span>${esc(f.name)}<br><span class="mu">${f.g} г</span></span><b>${f.kcal}</b></div>`).join('')}</div>`:''}).join(''):empty('В этот день ничего не добавлено.'))}
act.cd=v=>{calDate=addD(calDate,+v);render()};
const calc=()=>Math.round((+F.per||0)*(+F.g||0)/100);
act.fEdit=id=>{F=id?{...D.food.find(f=>f.id===id)}:{id:'',date:calDate,meal:'Завтрак',name:'',per:'',g:100};openSheet(()=>shf('Продукт',`<input class="in" data-f="name" placeholder="Название" value="${esc(F.name)}">${Object.keys(D.prod).length?`<div class="ch">${Object.keys(D.prod).slice(-6).map(p=>`<button data-a="prod" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div><div style="height:10px"></div>`:''}<div class="ch" style="margin-bottom:10px">${MEALS.map(m=>`<button class="${F.meal===m?'on':''}" data-a="setF" data-k="meal" data-v="${m}">${m}</button>`).join('')}</div>
<label>Ккал на 100 г</label><input class="in" type="number" inputmode="decimal" data-f="per" value="${esc(F.per)}"><label>Количество, г</label><input class="in" type="number" inputmode="decimal" data-f="g" value="${esc(F.g)}"><div class="card c"><b id="pv">${calc()} ккал</b></div>`,'fSave',F.id&&'food:'+F.id))};
act.prod=v=>{F.name=v;F.per=D.prod[v];refresh()};
act.fSave=()=>{if(!F.name.trim()||!(+F.per>0)||!(+F.g>0))return toast('Укажите название, ккал и граммы');if(!F.id)F.id=uid();D.prod[F.name.trim()]=+F.per;upsert('food',{...F,name:F.name.trim(),per:+F.per,g:+F.g,kcal:calc()})};
/* more */
function vMore(){return head('Ещё','Все разделы Daynote')+`<div class="gr">${Object.keys(SEC).filter(k=>!D.nav.includes(k)).map(k=>`<button class="tile" data-a="go" data-v="${k}"><i>${SEC[k][0]}</i>${SEC[k][1]}</button>`).join('')}</div><p class="mu c">Нижнюю панель можно настроить в разделе «Настройки».</p>`}
/* games */
function vGames(){return head('Игры','Отдохните пару минут',bk())+`<div class="gr"><button class="tile" data-a="go" data-v="pet">Тамагочи<span class="mu">Виртуальный питомец</span></button><button class="tile" data-a="go" data-v="snake">Змейка<span class="mu">Классическая игра</span></button></div>`}
function stopGames(){clearInterval(petT);petT=0;if(SN)clearInterval(SN.t)}
const fo=s=>{let p;do p={x:Math.random()*15|0,y:Math.random()*15|0};while(s.some(q=>q.x===p.x&&q.y===p.y));return p};
function vSnake(){setTimeout(snakeInit,0);return head('Змейка','Рекорд: '+D.best,'games')+`<div class="card cv"><canvas id="cv" width="300" height="300"></canvas></div><div class="mu c" id="sc2">Счёт: 0. Свайпайте по полю или жмите стрелки.</div><div class="pad"><span></span><button data-a="dir" data-v="U">↑</button><span></span><button data-a="dir" data-v="L">←</button><button data-a="dir" data-v="D">↓</button><button data-a="dir" data-v="R">→</button></div><button class="big" id="sb" data-a="sStart">Играть</button>`}
function snakeInit(){if(SN)clearInterval(SN.t);SN={s:[{x:7,y:7},{x:6,y:7},{x:5,y:7}],d:{x:1,y:0},nd:{x:1,y:0},f:null,sc:0,on:0};SN.f=fo(SN.s);sdraw()}
function sdraw(msg){const c=$('#cv');if(!c||!SN)return;const x=c.getContext('2d');x.fillStyle='#ece9fb';x.fillRect(0,0,300,300);x.fillStyle='#ef7f7f';x.beginPath();x.arc(SN.f.x*20+10,SN.f.y*20+10,7,0,7);x.fill();
 SN.s.forEach((p,i)=>{x.fillStyle=i?'#8175D8':'#5f52c2';x.beginPath();x[x.roundRect?'roundRect':'rect'](p.x*20+1,p.y*20+1,18,18,6);x.fill()});
 if(msg){x.fillStyle='rgba(28,27,41,.55)';x.fillRect(0,0,300,300);x.fillStyle='#fff';x.font='600 22px system-ui';x.textAlign='center';x.fillText(msg,150,155)}}
function sStep(){const g=SN,h={x:g.s[0].x+g.nd.x,y:g.s[0].y+g.nd.y};g.d=g.nd;
 if(h.x<0||h.y<0||h.x>14||h.y>14||g.s.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(g.t);g.on=0;if(g.sc>D.best){D.best=g.sc;save()}sdraw('Игра окончена');$('#sb').textContent='Играть снова';return}
 g.s.unshift(h);if(h.x===g.f.x&&h.y===g.f.y){g.sc++;g.f=fo(g.s);$('#sc2').textContent='Счёт: '+g.sc}else g.s.pop();sdraw()}
act.sStart=()=>{snakeInit();SN.on=1;$('#sc2').textContent='Счёт: 0';$('#sb').textContent='Начать заново';SN.t=setInterval(sStep,130)};
const DIRS={U:{x:0,y:-1},D:{x:0,y:1},L:{x:-1,y:0},R:{x:1,y:0}};
act.dir=v=>{if(!SN||!SN.on)return;const n=DIRS[v];if(SN.d.x+n.x||SN.d.y+n.y)SN.nd=n};
let tp=null;document.addEventListener('touchstart',e=>{tp=e.target.id==='cv'?e.touches[0]:null},{passive:true});
document.addEventListener('touchend',e=>{if(!tp)return;const t=e.changedTouches[0],dx=t.clientX-tp.clientX,dy=t.clientY-tp.clientY;tp=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;act.dir(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))});
document.addEventListener('keydown',e=>{const m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R'}[e.key];if(m&&page==='snake'){e.preventDefault();act.dir(m)}});
function petCalc(){const p=D.pet,m=(Date.now()-p.t)/6e4;p.h=Math.max(0,p.h-m*.5);p.j=Math.max(0,p.j-m*.4);p.e=Math.max(0,p.e-m*.25);p.t=Date.now()}
function vPet(){petCalc();save();if(!petT)petT=setInterval(()=>{if(page==='pet')render();else stopGames()},5000);const p=D.pet,a=(p.h+p.j+p.e)/3,low=Math.min(p.h,p.j,p.e);
 const face=a>70?'😸':a>45?'🐱':a>22?'😿':'🙀',msg=low>=40?'Дейни доволен':p.h===low?'Дейни проголодался':p.j===low?'Дейни скучает':'Дейни хочет спать';
 const sb=(l,v)=>`<div class="sb"><span>${l}</span><div class="bar ${v<25?'ov':''}"><i style="width:${v}%"></i></div></div>`;
 return head('Тамагочи',msg,'games')+`<div class="card"><div class="pet">${face}</div>${sb('Сытость',p.h)}${sb('Радость',p.j)}${sb('Бодрость',p.e)}</div><div class="gr"><button class="tile" data-a="pet" data-v="f">Покормить</button><button class="tile" data-a="pet" data-v="p">Играть</button></div><button class="big" data-a="pet" data-v="s">Уложить спать</button>`}
act.pet=v=>{petCalc();const p=D.pet;if(v==='f')p.h=Math.min(100,p.h+30);if(v==='p'){p.j=Math.min(100,p.j+25);p.e=Math.max(0,p.e-8)}if(v==='s')p.e=Math.min(100,p.e+35);save();render()};
/* settings */
function vSet(){const th=D.theme||'auto',nt='Notification' in window?Notification.permission:'none';
 return head('Настройки','Панель, внешний вид, данные',bk())+`<h3>Нижняя панель (до 4 разделов)</h3><div class="card">${Object.keys(SEC).map(k=>{const i=D.nav.indexOf(k);return `<div class="rw"><span>${SEC[k][1]}</span><span class="rt">${i>=0?`<button class="rb" data-a="navM" data-v="${k}:-1">↑</button><button class="rb" data-a="navM" data-v="${k}:1">↓</button>`:''}<button class="sw ${i>=0?'on':''}" data-a="navT" data-v="${k}"></button></span></div>`}).join('')}<button class="lk" data-a="navR">Вернуть стандартную</button></div>
<h3>Внешний вид</h3><div class="card">${chip('th',[['auto','Авто'],['light','Светлая'],['dark','Тёмная']],th).replace(/data-a="setF" data-k="th"/g,'data-a="setTh"')}</div>
<h3>Калории</h3><div class="card"><label style="margin-top:0">Цель на день, ккал</label><input class="in" style="margin:0" type="number" inputmode="numeric" data-d="goal" value="${D.goal}"></div>
<h3>Уведомления</h3><div class="card"><div class="mu" style="margin-bottom:8px">${nt==='granted'?'Разрешены. Напоминания приходят, пока приложение открыто или работает в фоне.':nt==='none'?'Этот браузер не поддерживает уведомления.':'Разрешите уведомления, чтобы получать напоминания о задачах.'}</div>${nt==='default'?'<button class="lk" data-a="reqN">Разрешить уведомления</button>':''}</div>
<h3>Данные</h3><div class="card"><button class="lk" data-a="exp">Скопировать резервную копию</button><br><button class="lk" data-a="imp">Восстановить из копии</button><button class="dl" data-a="wipe">Стереть все данные</button></div>`}
act.navT=k=>{const i=D.nav.indexOf(k);if(i>=0){if(D.nav.length<2)return toast('В панели должен остаться один раздел');D.nav.splice(i,1)}else{if(D.nav.length>=4)return toast('В панели максимум 4 раздела');D.nav.push(k)}save();render()};
act.navM=v=>{const[k,d]=v.split(':'),i=D.nav.indexOf(k),j=i+ +d;if(j<0||j>=D.nav.length)return;[D.nav[i],D.nav[j]]=[D.nav[j],D.nav[i]];save();render()};
act.navR=()=>{D.nav=['tasks','diary','trk'];save();render()};
act.setTh=v=>{D.theme=v;save();applyTheme();render()};
const applyTheme=()=>{document.documentElement.dataset.theme=D.theme==='light'||D.theme==='dark'?D.theme:''};
act.reqN=()=>{try{Notification.requestPermission().then(render)}catch(e){}};
act.exp=()=>{(navigator.clipboard?navigator.clipboard.writeText(JSON.stringify(D)):Promise.reject()).then(()=>toast('Копия скопирована'),()=>toast('Не удалось скопировать'))};
act.imp=()=>{F={txt:''};openSheet(()=>shf('Восстановление','<textarea class="in" rows="8" data-f="txt" placeholder="Вставьте копию данных"></textarea>','impGo'))};
act.impGo=()=>{try{D=Object.assign(DEF(),JSON.parse(F.txt));save();applyTheme();act.closeSheet();render();toast('Данные восстановлены')}catch(e){toast('Неверный формат копии')}};
act.wipe=(v,el)=>{if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Нажмите ещё раз: данные будут удалены';return}D=DEF();save();applyTheme();render()};
/* events */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&act[t.dataset.a])act[t.dataset.a](t.dataset.v,t)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f){F[t.dataset.f]=t.value;const pv=$('#pv');if(pv)pv.textContent=calc()+' ккал'}else if(t.dataset.d){D[t.dataset.d]=+t.value||0;save()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
applyTheme();render();tick();setInterval(tick,20000);
</script></body></html>
