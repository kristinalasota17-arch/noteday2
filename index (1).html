<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8175D8">
<title>Daynote</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ac:#8175D8;--bg:color-mix(in srgb,var(--ac) 6%,#fff);--ac2:color-mix(in srgb,var(--ac) 16%,#fff);--tx:#1c1b29;--mu:#8b89a0;--cd:#fff;--ln:#ececf6;--sh:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:color-mix(in srgb,var(--ac) 7%,#101018);--cd:#1e1d2b;--tx:#f2f1fa;--mu:#9a98b0;--ln:#2c2b3d;--ac2:color-mix(in srgb,var(--ac) 24%,#1e1d2b);--sh:none}}
:root[data-theme="dark"]{--bg:color-mix(in srgb,var(--ac) 7%,#101018);--cd:#1e1d2b;--tx:#f2f1fa;--mu:#9a98b0;--ln:#2c2b3d;--ac2:color-mix(in srgb,var(--ac) 24%,#1e1d2b);--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,system-ui,sans-serif;font-size:16px}
button,input,textarea{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
#main{flex:1;overflow-y:auto;padding:14px 18px 24px}
.hd{display:flex;gap:12px;align-items:center;margin:6px 0 16px}
h1{margin:0;font-size:32px;letter-spacing:-.02em;font-weight:700}
.hd p{margin:2px 0 0;color:var(--mu);font-size:15px}.hd p::first-letter{text-transform:uppercase}
h3{font-size:15px;margin:18px 4px 8px;color:var(--mu);font-weight:600}
.bk{flex:none;border:0;background:var(--cd);box-shadow:var(--sh);width:40px;height:40px;border-radius:14px;font-size:24px;color:var(--ac);padding:0}
.card{background:var(--cd);border-radius:20px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px}
.big{width:100%;border:0;border-radius:18px;background:var(--ac);color:#fff;font-size:17px;font-weight:600;padding:16px;margin:0 0 14px;box-shadow:0 8px 20px rgba(129,117,216,.35);transition:transform .15s}
.big:active,.tile:active,.rb:active{transform:scale(.96)}
.seg{display:flex;background:var(--ln);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:11px;font-weight:600;color:var(--mu)}
.seg .on{background:var(--cd);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tk{display:flex;gap:12px;align-items:flex-start}.g{flex:1;min-width:0;cursor:pointer}
.tt{font-weight:600;font-size:17px}.dn .tt{text-decoration:line-through;color:var(--mu)}.dn{opacity:.7}
.ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ac);background:none;color:#fff;font-size:15px;padding:0;margin-top:1px}.ck.on{background:var(--ac)}
.mt{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px;color:var(--mu)}
.mt span{background:var(--bg);border-radius:9px;padding:3px 8px;display:flex;align-items:center;gap:5px}
.mt u{width:7px;height:7px;border-radius:50%}.od{color:#e0605f!important}
.mu{color:var(--mu);font-size:14px}.c{text-align:center}.em{text-align:center;color:var(--mu);padding:40px 20px}
.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
#nav{display:flex;flex:none;background:var(--cd);box-shadow:0 -4px 24px rgba(129,117,216,.14);padding:9px 10px 8px;border-radius:26px 26px 0 0}
.ni{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mu);padding:0}
.ni i{font-style:normal;font-size:26px;width:62px;height:36px;display:grid;place-items:center;border-radius:18px;transition:.2s}
.ni b{font-size:12px;font-weight:600}.ni.on{color:var(--ac)}.ni.on i{background:var(--ac2)}
#ov{position:fixed;inset:0;background:rgba(20,18,40,.4);opacity:0;pointer-events:none;transition:.25s;z-index:20}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:92%;background:var(--cd);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column}
#sh.on{transform:none}#ov.on{opacity:1;pointer-events:auto}
#sc{overflow-y:auto;padding:8px 18px calc(28px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:8px auto 0;flex:none}
.sh{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px}.sh b{font-size:18px}
.lk{border:0;background:none;color:var(--ac);font-weight:600;font-size:16px;padding:6px 0}
.dl{width:100%;border:0;background:none;color:#e0605f;font-weight:600;padding:14px}
.in{width:100%;border:0;background:var(--bg);border-radius:14px;padding:13px 14px;margin-bottom:10px;font-size:16px;resize:none;outline:none;cursor:text}
.in:focus{box-shadow:0 0 0 2px var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 8px;font-weight:500}
.ch{display:flex;flex-wrap:wrap;gap:8px}
.ch button,.dc{border:0;background:var(--bg);border-radius:12px;padding:9px 13px;color:var(--tx)}
.ch .on,.dc.on{background:var(--ac);color:#fff}
.dcs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.dc{flex:none;width:54px;display:flex;flex-direction:column;align-items:center;padding:8px 0}.dc small{font-size:11px;opacity:.8}.dc b{font-size:18px}
.ww{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;height:160px;background:var(--bg);border-radius:16px;overflow:hidden;margin-bottom:6px}
.ww::after{content:"";position:absolute;left:12px;right:12px;top:60px;height:40px;background:var(--ac2);border-radius:12px;pointer-events:none}
.wh{position:relative;z-index:1;width:80px;height:160px;overflow-y:auto;scroll-snap-type:y mandatory;padding:60px 0;scrollbar-width:none}
.wh::-webkit-scrollbar{display:none}
.wh div{height:40px;line-height:40px;text-align:center;font-size:22px;font-weight:600;scroll-snap-align:center}
.rg{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--ln) 0)}
.rg span{width:44px;height:44px;border-radius:50%;background:var(--cd);display:grid;place-items:center;font-size:22px}
.rb{flex:none;width:44px;height:44px;border-radius:14px;border:0;background:var(--ac2);color:var(--ac);font-size:24px;font-weight:600;padding:0;transition:transform .15s}.rb.p{background:var(--ac);color:#fff}
.bars{display:flex;gap:5px;height:34px;margin-top:12px}
.bars i{flex:1;background:var(--ln);border-radius:5px;position:relative;overflow:hidden}.bars b{position:absolute;bottom:0;left:0;right:0;background:var(--ac)}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:5px;transition:width .4s}.bar.ov i{background:#ef7f7f}
.kk{font-size:15px;color:var(--mu)}.kk b{font-size:30px;color:var(--tx)}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln)}.rw:last-child{border:0}
.rt{display:flex;gap:8px;align-items:center}.rt .rb{width:34px;height:34px;font-size:17px}
.dn2{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dn2 button{border:0;background:var(--cd);box-shadow:var(--sh);width:40px;height:40px;border-radius:14px;font-size:22px;color:var(--ac);padding:0}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{border:0;text-align:left;background:var(--cd);box-shadow:var(--sh);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;font-weight:600;font-size:17px;transition:transform .15s}
.tile i{font-style:normal;font-size:36px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--ln);border:0;position:relative;flex:none;transition:.2s;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--ac)}.sw.on::after{left:22px}
.cv{display:grid;place-items:center;padding:12px}canvas{width:100%;max-width:300px;aspect-ratio:1;border-radius:16px;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin:12px 0 16px}
.pad button{height:54px;border:0;border-radius:16px;background:var(--cd);box-shadow:var(--sh);font-size:22px;color:var(--ac);padding:0}
.pet{font-size:110px;text-align:center;line-height:1.2;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){.pet{animation:none}}
.sb{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}.sb span{width:84px}.sb .bar{flex:1;margin:0}
#ts{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px);background:#1c1b29;color:#fff;padding:11px 18px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;font-size:14px;max-width:86%;text-align:center}
#ts.on{opacity:1;transform:translate(-50%,0)}
h1{font-size:28px;font-weight:600}
.card,.tile,.bk,.dn2 button,.pad button{border:1px solid var(--ln)}
.card,.tile{border-radius:16px}
.big{border-radius:14px;padding:14px;font-size:16px;box-shadow:none}
#nav{border-radius:0;box-shadow:none;border-top:1px solid var(--ln);padding:8px 8px 6px}
.ni i{width:auto;height:28px;background:none!important;border-radius:0}
.ni svg{width:26px;height:26px}.ni b{font-weight:500;font-size:11px}
.tile{gap:14px;font-size:16px;font-weight:500}.tile i{display:block;color:var(--ac)}.tile i svg{width:28px;height:28px}.tile .mu{font-weight:400}
.seg{border-radius:12px}.seg button{font-size:15px}
.ch button{flex:none}
.sub{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:15px}.sub i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ac);flex:none}.sub i.on{background:var(--ac)}
.g.dn{text-decoration:line-through;color:var(--mu)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.sq{width:36px;height:36px;border-radius:50%!important;padding:0!important}.sq.on{box-shadow:0 0 0 3px var(--cd),0 0 0 5px var(--tx)}
.cp{width:44px;height:44px;border:0;padding:0;border-radius:12px;background:none;flex:none}
.tile.on{border-color:var(--ac)}.tile.c{align-items:center;text-align:center;font-size:14px}.tile i{font-size:34px}.g3{grid-template-columns:repeat(3,1fr)}
.bub{background:var(--ac2);border-radius:16px;padding:10px 14px;text-align:center;font-size:15px;min-height:44px;margin-bottom:10px;position:relative}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--ac2);transform:translateX(-50%) rotate(45deg)}
.chart{display:flex;gap:3px;height:130px;align-items:flex-end}.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.col b{width:100%;background:var(--ac);border-radius:4px 4px 2px 2px;min-height:2px}.col small{font-size:10px;color:var(--mu);height:12px;white-space:nowrap}
.bbg{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:var(--ln);padding:3px;border-radius:14px;max-width:340px;margin:0 auto}
.bc{aspect-ratio:1;border:0;border-radius:5px;background:var(--cd);padding:0}.bc.on{background:var(--ac)}
.pcs{display:flex;justify-content:space-around;align-items:center;margin:14px 0;min-height:80px}
.pc{border:2px solid transparent;border-radius:12px;padding:8px;background:none;display:grid;gap:2px}.pc.sel{border-color:var(--ac)}
.pc i{width:16px;height:16px;border-radius:4px;background:var(--ac)}.pc i.o{background:none}
#main.pg{animation:fi .25s ease}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){#main.pg{animation:none}}
</style></head>
<body><div id="app"><div id="main"></div><div id="nav"></div></div>
<div id="ov" data-a="closeSheet"></div><div id="sh"><div class="grab"></div><div id="sc"></div></div><div id="ts"></div>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ds(d)};
const fmt=(s,o)=>new Date(s+'T12:00').toLocaleDateString('ru-RU',o||{day:'numeric',month:'short'});
const rel=d=>d===today()?'Сегодня':d===addD(today(),1)?'Завтра':d===addD(today(),-1)?'Вчера':fmt(d);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DEF=()=>({tasks:[],diary:[],trk:[],food:[],prod:{},notes:[],lists:[],goals:[],cats:[{n:'Работа',c:'#5b8def'},{n:'Учёба',c:'#9b6cf0'},{n:'Дом',c:'#3dae8c'},{n:'Покупки',c:'#f0a24a'},{n:'Личное',c:'#e86fa3'},{n:'Здоровье',c:'#e5594f'},{n:'Другое',c:'#8b89a0'}],nav:['tasks','diary','trk'],goal:2000,best:0,bb:0,theme:'auto',accent:0,nt:{tasks:1,habits:0,goals:1},pets:{},petId:'claude'});
let D;try{D=Object.assign(DEF(),JSON.parse(localStorage.getItem('daynote')||'{}'))}catch(e){D=DEF()}
const save=()=>{try{localStorage.setItem('daynote',JSON.stringify(D))}catch(e){}};
const ic=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const PLUS=ic('<path d="M12 5v14M5 12h14"/>');
const TH=[['Лаванда','#8175D8'],['Розовая','#E86FA3'],['Жёлтая','#D99A00'],['Голубая','#3A9AD9'],['Мятная','#3DAE8C'],['Персик','#F0805A'],['Графит','#566074']];
const SEC={tasks:[ic('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/>'),'Задачи'],diary:[ic('<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/>'),'Дневник'],trk:[ic('<path d="M5 20V11M12 20V5M19 20v-6"/>'),'Трекеры'],notes:[ic('<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>'),'Заметки'],lists:[ic('<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>'),'Списки'],goals:[ic('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'),'Цели'],cal:[ic('<path d="M12 3c2 3 6 5 6 10a6 6 0 01-12 0c0-2 1-3 2-4 .5 1.5 1.5 2 2 2 0-3-.5-5 2-8z"/>'),'Калории'],stats:[ic('<path d="M4 4v16h16"/><path d="M8 15l3-4 3 2 4-6"/>'),'Статистика'],games:[ic('<rect x="3" y="8" width="18" height="10" rx="5"/><path d="M8 11v4M6 13h4"/><circle cx="16" cy="12" r=".8"/><circle cx="18" cy="14" r=".8"/>'),'Игры'],search:[ic('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),'Поиск'],set:[ic('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'),'Настройки']};
const PR=['Низкий','Средний','Высокий'],PC=['#9bd3a5','#f2c46d','#ef7f7f'],CAT=['Личное','Работа','Учёба','Дом','Здоровье'];
const MOOD=['Хорошо','Спокойно','Обычно','Грустно','Злюсь'],MEALS=['Завтрак','Обед','Ужин','Перекус'],NUMK=['pr','rem','rep'];
let page='tasks',tab='act',calDate=today(),F={},SB=null,SN=null,petT=0;
const act={};
const toast=t=>{const e=$('#ts');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)};
const empty=t=>`<div class="em">${t}</div>`;
const bk=()=>D.nav.includes(page)?'':'more';
const head=(t,s,b)=>`<div class="hd">${b?`<button class="bk" data-a="go" data-v="${b}">‹</button>`:''}<div><h1>${t}</h1><p>${s||''}</p></div></div>`;
const seg=(o,v,a)=>`<div class="seg">${o.map(([k,l])=>`<button class="${k===v?'on':''}" data-a="${a}" data-v="${k}">${l}</button>`).join('')}</div>`;
const chip=(k,l,sel)=>`<div class="ch">${l.map(([v,t])=>`<button class="${String(sel)===String(v)?'on':''}" data-a="setF" data-k="${k}" data-v="${esc(v)}">${t}</button>`).join('')}</div>`;
function dchips(sel,key,from,to,none){let h='';for(let i=from;i<=to;i++){const d=addD(today(),i);h+=`<button class="dc ${sel===d?'on':''}" data-a="setF" data-k="${key}" data-v="${d}"><small>${i==0?'Сег':fmt(d,{weekday:'short'})}</small><b>${+d.slice(8)}</b></button>`}
 if(none)h=`<button class="dc ${sel===''?'on':''}" data-a="setF" data-k="${key}" data-v=""><small>Нет</small><b>–</b></button>`+h;return `<div class="dcs">${h}</div>`}
function shf(title,body,sv,del){return `<div class="sh"><button class="lk" data-a="closeSheet">Отмена</button><b>${title}</b><span style="width:52px"></span></div>${body}<button class="big" style="margin-top:18px" data-a="${sv}">Сохранить</button>${del?`<button class="dl" data-a="del" data-v="${del}">Удалить</button>`:''}`}
function openSheet(fn){SB=fn;$('#sc').innerHTML=fn();$('#sc').scrollTop=0;$('#ov').classList.add('on');$('#sh').classList.add('on');initWheels()}
function refresh(){const s=$('#sc'),y=s.scrollTop,d=$('.dcs'),x=d?d.scrollLeft:0;s.innerHTML=SB();s.scrollTop=y;const d2=$('.dcs');if(d2)d2.scrollLeft=x;initWheels()}
act.closeSheet=()=>{$('#ov').classList.remove('on');$('#sh').classList.remove('on')};
act.setF=(v,el)=>{const k=el.dataset.k;F[k]=NUMK.includes(k)?+v:v;refresh()};
act.del=(v,el)=>{if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Нажмите ещё раз для удаления';return}const[a,id]=v.split(':');D[a]=D[a].filter(x=>x.id!==id);save();act.closeSheet();render()};
function upsert(a,o){const i=D[a].findIndex(x=>x.id===o.id);if(i<0)D[a].push(o);else D[a][i]=o;save();act.closeSheet();render()}
function render(){LIVE=null;const v={tasks:vTasks,diary:vDiary,trk:vTrk,cal:vCal,games:vGames,set:vSet,more:vMore,snake:vSnake,pet:vPet,notes:vNotes,lists:vLists,list:vList,goals:vGoals,stats:vStats,search:vSearch,bb:vBB}[page]();
 $('#main').innerHTML=v;
 $('#nav').innerHTML=D.nav.map(k=>`<button class="ni ${page===k?'on':''}" data-a="go" data-v="${k}"><i>${SEC[k][0]}</i><b>${SEC[k][1]}</b></button>`).join('')+`<button class="ni ${D.nav.includes(page)?'':'on'}" data-a="go" data-v="more"><i>${PLUS}</i><b>Ещё</b></button>`}
act.go=p=>{stopGames();page=p;render();const m=$('#main');m.scrollTop=0;m.classList.remove('pg');void m.offsetWidth;m.classList.add('pg')};
act.tab=v=>{tab=v;render()};
/* wheels */
function initWheels(){$$('.wh').forEach(w=>{const[h,m]=(F.time||'09:00').split(':').map(Number);w.scrollTop=(w.id==='wh'?h:Math.round(m/5))*40;
 w.onscroll=()=>{clearTimeout(w._t);w._t=setTimeout(()=>{const h=$('#wh'),m=$('#wm');if(!h||!m||!F.time)return;F.time=pad(Math.min(23,Math.round(h.scrollTop/40)))+':'+pad(Math.min(55,Math.round(m.scrollTop/40)*5))},90)}})}

const bbFit=(s,r,c)=>SH[s].every((row,y)=>row.every((v,x)=>!v||(r+y<8&&c+x<8&&!BB.g[(r+y)*8+c+x])));
const bbAny=()=>BB.ps.some(s=>s!=null&&Array.from({length:64},(_,i)=>i).some(i=>bbFit(s,i>>3,i&7)));
function bbHTML(){return `<div class="c" style="margin-bottom:10px"><b style="font-size:28px">${BB.sc}</b> <span class="mu">рекорд ${D.bb}</span></div><div class="bbg">${BB.g.map((v,i)=>`<button class="bc ${v?'on':''}" data-a="bp" data-v="${i}"></button>`).join('')}</div><div class="pcs">${BB.ps.map((s,i)=>s==null?'<span></span>':`<button class="pc ${BB.sel===i?'sel':''}" style="grid-template-columns:repeat(${sw(s)},16px)" data-a="bs" data-v="${i}">${SH[s].map(row=>{let o='';for(let x=0;x<sw(s);x++)o+=`<i class="${row[x]?'':'o'}"></i>`;return o}).join('')}</button>`).join('')}</div>${BB.over?'<div class="card c"><b>Нет ходов. Игра окончена.</b></div>':'<p class="mu c">Выберите фигуру и нажмите клетку: туда встанет её левый верхний угол.</p>'}`}
function vBB(){if(!BB)bbNew();return head('Блоки','Собирайте линии','games')+'<div id="bb">'+bbHTML()+'</div><button class="big" data-a="bbR">Новая игра</button>'}
act.bs=v=>{if(BB.ps[+v]!=null){BB.sel=+v;$('#bb').innerHTML=bbHTML()}};
act.bbR=()=>{bbNew();$('#bb').innerHTML=bbHTML()};
act.bp=v=>{if(BB.over)return;const s=BB.ps[BB.sel],i=+v;if(s==null)return toast('Выберите фигуру');const r=i>>3,c=i&7;if(!bbFit(s,r,c))return toast('Сюда не помещается');
 SH[s].forEach((row,y)=>row.forEach((q,x)=>{if(q){BB.g[(r+y)*8+c+x]=1;BB.sc++}}));BB.ps[BB.sel]=null;
 const rows=[],cols=[];for(let k=0;k<8;k++){let a=1,b=1;for(let x=0;x<8;x++){if(!BB.g[k*8+x])a=0;if(!BB.g[x*8+k])b=0}if(a)rows.push(k);if(b)cols.push(k)}
 rows.forEach(k=>{for(let x=0;x<8;x++)BB.g[k*8+x]=0});cols.forEach(k=>{for(let y=0;y<8;y++)BB.g[y*8+k]=0});
 const n=rows.length+cols.length;BB.sc+=n*10+(n>1?(n-1)*10:0);
 if(BB.ps.every(x=>x==null))BB.ps=[rs(),rs(),rs()];BB.sel=BB.ps.findIndex(x=>x!=null);
 if(!bbAny())BB.over=1;if(BB.sc>D.bb)D.bb=BB.sc;save();$('#bb').innerHTML=bbHTML()};

/* settings */
const applyTheme=()=>{const r=document.documentElement;r.dataset.theme=D.theme==='light'||D.theme==='dark'?D.theme:'';r.style.setProperty('--ac',AC());const m=document.querySelector('meta[name=theme-color]');if(m)m.content=AC()};
function vSet(){if(!F._set)F={_set:1,cn:'',cc:AC()};const nt='Notification' in window?Notification.permission:'none';
 return head('Настройки','Внешний вид, панель, данные',bk())+`<h3>Тема</h3><div class="card"><div class="ch">${[['auto','Авто'],['light','Светлая'],['dark','Тёмная']].map(([k,l])=>`<button class="${(D.theme||'auto')===k?'on':''}" data-a="setTh" data-v="${k}">${l}</button>`).join('')}</div><label>Цвет</label><div class="ch">${TH.map((t,i)=>`<button class="sq ${(D.accent||0)===i?'on':''}" style="background:${t[1]}" data-a="acc" data-v="${i}" title="${t[0]}"></button>`).join('')}</div></div>
<h3>Нижняя панель (до 4 разделов)</h3><div class="card">${Object.keys(SEC).map(k=>{const i=D.nav.indexOf(k);return `<div class="rw"><span>${SEC[k][1]}</span><span class="rt">${i>=0?`<button class="rb" data-a="navM" data-v="${k}:-1">↑</button><button class="rb" data-a="navM" data-v="${k}:1">↓</button>`:''}<button class="sw ${i>=0?'on':''}" data-a="navT" data-v="${k}"></button></span></div>`}).join('')}<button class="lk" data-a="navR">Вернуть стандартную</button></div>
<h3>Категории задач</h3><div class="card">${D.cats.map((c,i)=>`<div class="rw"><span><u class="dot" style="background:${c.c}"></u>${esc(c.n)}</span>${D.cats.length>1?`<button class="rb" style="width:34px;height:34px;font-size:18px" data-a="catD" data-v="${i}">×</button>`:''}</div>`).join('')}<div style="display:flex;gap:8px;margin-top:10px;align-items:center"><input class="in" style="margin:0" data-f="cn" placeholder="Новая категория" value="${esc(F.cn)}"><input type="color" class="cp" data-f="cc" value="${F.cc}"><button class="rb p" data-a="catA">+</button></div></div>
<h3>Калории</h3><div class="card"><label style="margin-top:0">Цель на день, ккал</label><input class="in" style="margin:0" type="number" inputmode="numeric" data-d="goal" value="${D.goal}"></div>
<h3>Уведомления</h3><div class="card">${[['tasks','Напоминания о задачах'],['habits','Трекеры (в 20:00)'],['goals','Сроки целей (в 9:00)']].map(([k,l])=>`<div class="rw"><span>${l}</span><button class="sw ${D.nt[k]?'on':''}" data-a="ntT" data-v="${k}"></button></div>`).join('')}<div class="mu" style="margin:8px 0">${nt==='granted'?'Уведомления разрешены. Они приходят, пока приложение открыто или работает в фоне.':nt==='none'?'В этой версии уведомления показываются внутри приложения, пока оно открыто.':'Разрешите уведомления, чтобы получать напоминания.'}</div>${nt==='default'?'<button class="lk" data-a="reqN">Разрешить уведомления</button>':''}</div>
<h3>Данные</h3><div class="card"><button class="lk" data-a="exp">Скопировать резервную копию</button><br><button class="lk" data-a="imp">Восстановить из копии</button><button class="dl" data-a="wipe">Стереть все данные</button></div>`}
act.navT=k=>{const i=D.nav.indexOf(k);if(i>=0){if(D.nav.length<2)return toast('В панели должен остаться один раздел');D.nav.splice(i,1)}else{if(D.nav.length>=4)return toast('В панели максимум 4 раздела');D.nav.push(k)}save();render()};
act.navM=v=>{const[k,d]=v.split(':'),i=D.nav.indexOf(k),n=i+ +d;if(i<0||n<0||n>=D.nav.length)return;[D.nav[i],D.nav[n]]=[D.nav[n],D.nav[i]];save();render()};
act.navR=()=>{D.nav=['tasks','diary','trk'];save();render()};
act.setTh=v=>{D.theme=v;save();applyTheme();render()};
act.acc=v=>{D.accent=+v;save();applyTheme();render()};
act.catA=()=>{if(!F.cn.trim())return toast('Введите название');D.cats.push({n:F.cn.trim(),c:F.cc});F={};save();render()};
act.catD=v=>{if(D.cats.length>1){D.cats.splice(+v,1);save();render()}};
act.ntT=k=>{D.nt[k]=D.nt[k]?0:1;save();render()};
act.reqN=()=>{try{Notification.requestPermission().then(render)}catch(e){}};
act.exp=()=>{(navigator.clipboard?navigator.clipboard.writeText(JSON.stringify(D)):Promise.reject()).then(()=>toast('Копия скопирована'),()=>toast('Не удалось скопировать'))};
act.imp=()=>{F={txt:''};openSheet(()=>shf('Восстановление','<textarea class="in" rows="8" data-f="txt" placeholder="Вставьте копию данных"></textarea>','impGo'))};
act.impGo=(v,el)=>{let o;try{o=JSON.parse(F.txt);if(!o||typeof o!=='object'||Array.isArray(o))throw 0}catch(e){return toast('Неверный формат копии')}
 if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Нажмите ещё раз: текущие данные будут заменены';return}
 D=Object.assign(DEF(),o);save();applyTheme();act.closeSheet();F={};render();toast('Данные восстановлены')};
act.wipe=(v,el)=>{if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Нажмите ещё раз: данные будут удалены';return}D=DEF();save();applyTheme();render()};

/* events */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&act[t.dataset.a])act[t.dataset.a](t.dataset.v,t)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.q){Q[t.dataset.q]=t.value;if(LIVE)LIVE()}else if(t.dataset.f){F[t.dataset.f]=t.value;const pv=$('#pv');if(pv)pv.textContent=calc()+' ккал'}else if(t.dataset.d){D[t.dataset.d]=+t.value||0;save()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='li')act.lAdd()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
applyTheme();render();tick();setInterval(tick,20000);
</script></body></html>
